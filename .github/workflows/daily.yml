name: Daily ads

# Makes the day's ads (photos + reels with music) and publishes them as the release tagged YYYY-MM-DD.
# 01:30 UTC = 7:00 AM India; the 02:45 UTC run (8:15 AM) is a backup in case GitHub delays the first.
on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "45 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to make (YYYY-MM-DD); empty = today in India"
        required: false

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          day="${INPUT_DATE:-$(TZ=Asia/Kolkata date +%F)}"
          [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date $day"; exit 1; }
          echo "DAY=$day" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "schedule" ] && gh release view "$day" >/dev/null 2>&1; then
            echo "SKIP=1" >> "$GITHUB_ENV"
            echo "$day already published"
          fi
      - name: Install tools
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libraqm0 fonts-dejavu-core >/dev/null
          pip install -q pillow numpy
      - name: Make the ads
        if: env.SKIP != '1'
        run: python3 adgen/daily.py "$DAY" out
      - name: Publish the release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(out/"$DAY"/*)
          if gh release view "$DAY" >/dev/null 2>&1; then
            gh release upload "$DAY" "${files[@]}" --clobber
          else
            gh release create "$DAY" "${files[@]}" --title "Chhatrapati Bullion ads $DAY" \
              --notes "Ads for $DAY: photos and reels, 1080x1920, Gujarati and Hindi." --latest=false
          fi
      - name: Refresh index.json
        if: env.SKIP != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/make_index.py "$GITHUB_REPOSITORY" > index.json
          if git diff --quiet -I '"updated"' -- index.json 2>/dev/null && git ls-files --error-unmatch index.json >/dev/null 2>&1; then exit 0; fi
          git config user.name "chhatrapati-bot"
          git config user.email "chhatrapati-bot@users.noreply.github.com"
          git add index.json
          git commit -m "Ads for $DAY"
          git pull --rebase origin main
          git push origin HEAD:main
