name: Daily ads

# Makes the day's ads (photos + reels with music) and publishes them as the release tagged YYYY-MM-DD.
# Morning: 01:30 UTC = 7:00 AM India; the 02:45 UTC run (8:15 AM) is a backup in case GitHub delays the first.
# The "Good evening" ad is made only on request: Run workflow with "evening" ticked.
on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "45 2 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date to make (YYYY-MM-DD); empty = today in India"
        required: false
      evening:
        description: "Make the Good evening ad"
        type: boolean
        default: false
      replace:
        description: "Remove that day's existing files first (use after a design change)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the date
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_EVENING: ${{ inputs.evening }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          day="${INPUT_DATE:-$(TZ=Asia/Kolkata date +%F)}"
          [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "bad date $day"; exit 1; }
          echo "DAY=$day" >> "$GITHUB_ENV"
          evening=""
          if [ "$INPUT_EVENING" = "true" ]; then evening="--evening"; fi
          echo "EVENING=$evening" >> "$GITHUB_ENV"
          if [ -n "$SCHEDULE" ]; then
            names="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$day" --jq '.assets[].name' 2>/dev/null || true)"
            want="good-morning\\|photo1-"; [ -n "$evening" ] && want="good-evening"
            if echo "$names" | grep -q "$want"; then
              echo "SKIP=1" >> "$GITHUB_ENV"
              echo "$day ${evening:-morning} already published"
            fi
          fi
      - name: Install tools
        if: env.SKIP != '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q numpy
          cd adgen && npm install --no-save --no-audit --no-fund playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Make the ads
        if: env.SKIP != '1'
        run: python3 adgen/daily.py "$DAY" out $EVENING
      - name: Publish the release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=(out/"$DAY"/*)
          if [ "${{ inputs.replace }}" = "true" ]; then
            for id in $(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DAY" --jq '.assets[].id' 2>/dev/null); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
            done
          fi
          if gh release view "$DAY" >/dev/null 2>&1; then
            gh release upload "$DAY" "${files[@]}" --clobber
          else
            gh release create "$DAY" "${files[@]}" --title "Chhatrapati Bullion ads $DAY" \
              --notes "Ads for $DAY: photos and reels, 1080x1920, Gujarati and Hindi." --latest=false
          fi
      - name: Refresh index.json
        if: env.SKIP != '1'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/make_index.py "$GITHUB_REPOSITORY" > index.json
          if git diff --quiet -I '"updated"' -- index.json 2>/dev/null && git ls-files --error-unmatch index.json >/dev/null 2>&1; then exit 0; fi
          git config user.name "chhatrapati-bot"
          git config user.email "chhatrapati-bot@users.noreply.github.com"
          git add index.json
          git commit -m "Ads for $DAY"
          git pull --rebase origin main
          git push origin HEAD:main
