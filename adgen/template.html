<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Daily ad designer. window.render(spec) builds a new poster from spec.design, which daily.py picks from the date:
  layout, colour palette, background motif, display font, title effect, illustration, header, info panel and motion
  all change from day to day (and between the three languages of one day). The shop information never changes.
-->
<style>
@font-face { font-family: "BalooBhai"; src: url("fonts/BalooBhai2.ttf"); font-weight: 400 800; }
@font-face { font-family: "Baloo"; src: url("fonts/Baloo2.ttf"); font-weight: 400 800; }
@font-face { font-family: "AnekGu"; src: url("fonts/AnekGujarati.ttf"); font-weight: 100 800; font-stretch: 75% 125%; }
@font-face { font-family: "AnekHi"; src: url("fonts/AnekDevanagari.ttf"); font-weight: 100 800; font-stretch: 75% 125%; }
@font-face { font-family: "MuktaVaani"; src: url("fonts/MuktaVaani-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: "Mukta"; src: url("fonts/Mukta-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: "Shrikhand"; src: url("fonts/Shrikhand-Regular.ttf"); }
@font-face { font-family: "KumarOne"; src: url("fonts/KumarOne-Regular.ttf"); }
@font-face { font-family: "Farsan"; src: url("fonts/Farsan-Regular.ttf"); }
@font-face { font-family: "Rasa"; src: url("fonts/Rasa.ttf"); font-weight: 300 700; }
@font-face { font-family: "Rozha"; src: url("fonts/RozhaOne-Regular.ttf"); }
@font-face { font-family: "Yatra"; src: url("fonts/YatraOne-Regular.ttf"); }
@font-face { font-family: "Khand"; src: url("fonts/Khand-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Teko"; src: url("fonts/Teko.ttf"); font-weight: 300 700; }
@font-face { font-family: "SerifGu"; src: url("fonts/NotoSerifGujarati.ttf"); font-weight: 100 900; }
@font-face { font-family: "SerifHi"; src: url("fonts/NotoSerifDevanagari.ttf"); font-weight: 100 900; }
@font-face { font-family: "SansGu"; src: url("fonts/HindVadodara-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "SansGu"; src: url("fonts/HindVadodara-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "SansHi"; src: url("fonts/Hind-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "SansHi"; src: url("fonts/Hind-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Poppins"; src: url("fonts/Poppins-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "Poppins"; src: url("fonts/Poppins-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: "Bebas"; src: url("fonts/BebasNeue-Regular.ttf"); }
@font-face { font-family: "Anton"; src: url("fonts/Anton-Regular.ttf"); }
@font-face { font-family: "Righteous"; src: url("fonts/Righteous-Regular.ttf"); }
@font-face { font-family: "Playfair"; src: url("fonts/PlayfairDisplay.ttf"); font-weight: 400 900; }
@font-face { font-family: "Cinzel"; src: url("fonts/Cinzel.ttf"); font-weight: 400 900; }
@font-face { font-family: "Montserrat"; src: url("fonts/Montserrat.ttf"); font-weight: 100 900; }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-weight: 600; }
body.gu { --body: "SansGu", "Poppins", sans-serif; }
body.hi { --body: "SansHi", "Poppins", sans-serif; }
body.en { --body: "Poppins", sans-serif; }
#stage { position: absolute; inset: 0; overflow: hidden; }
#bg { position: absolute; inset: 0; background: radial-gradient(ellipse 90% 60% at 50% 35%, var(--bg) 0%, var(--bg2) 100%); }
#motif { position: absolute; left: 0; top: 0; }
.abs { position: absolute; }
.nowrap { white-space: nowrap; }
.ctr { text-align: center; }

/* Display text (padding keeps tall matras inside painted boxes) */
.title { display: inline-block; font-family: var(--disp); font-weight: var(--dispw); line-height: 1.12; white-space: nowrap; color: var(--title); padding: .2em .08em .04em; }
.fx0 { text-shadow: 0 .07em 0 var(--shadow), 0 .1em .25em rgba(0,0,0,.25); }
.fx1 { -webkit-text-stroke: .045em var(--shadow); paint-order: stroke fill; text-shadow: .06em .06em 0 var(--b); }
.fx2 { background: linear-gradient(180deg, #fff6cf 0%, #f6d36b 35%, #c8901e 62%, #f9e08f 82%, #a8741a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 0 var(--shadow)); }
.fx3 { background: var(--hl); color: var(--hlInk); border-radius: 18px; padding: .22em .35em .06em; box-shadow: 10px 10px 0 var(--shadow); }
.sub { display: inline-block; font-weight: 700; white-space: nowrap; color: var(--ink); }
body.en .sub { font-family: "Playfair"; font-style: italic; font-weight: 700; }
.line { display: inline-block; font-weight: 700; white-space: nowrap; color: var(--ink); line-height: 1.35; }
.offer { display: inline-block; white-space: nowrap; font-weight: 700; background: var(--hl); color: var(--hlInk); border-radius: 80px; padding: .38em 1.1em .22em;
  box-shadow: 0 10px 0 var(--shadow), 0 14px 30px rgba(0,0,0,.25); }
body.en .offer { padding: .45em 1.1em .4em; }

/* Header */
#head { position: absolute; left: 0; right: 0; top: 0; height: 210px; }
.brandpill { display: inline-block; font-family: "Montserrat"; font-weight: 800; font-size: 26px; letter-spacing: 8px; padding: 12px 26px 12px 34px; border-radius: 40px;
  background: var(--hl); color: var(--hlInk); }
.bless { font-size: 30px; font-weight: 700; color: var(--ink); }
.datechip { display: inline-block; font-family: "Montserrat"; font-weight: 700; font-size: 22px; letter-spacing: 5px; padding: 8px 22px 8px 27px; border-radius: 30px;
  border: 2.5px solid var(--ink); color: var(--ink); }
.mono { width: 118px; height: 118px; flex: none; border-radius: 50%; background: var(--hl); color: var(--hlInk); display: flex; align-items: center; justify-content: center;
  font-family: var(--disp); font-size: 64px; box-shadow: 0 8px 0 var(--shadow); border: 5px solid var(--c2); padding-top: 8px; }

/* Info panel: one set of elements, four looks */
#panel { position: absolute; left: 36px; right: 36px; bottom: 34px; height: 520px; text-align: center; color: var(--pInk); }
#panel .pbg { position: absolute; inset: 0; }
#panel .pin { position: absolute; inset: 0; padding: 20px 34px 0; }
#shop { display: inline-block; font-family: var(--disp); font-weight: var(--dispw); font-size: 76px; line-height: 1.15; white-space: nowrap; color: var(--pAcc); padding-top: .14em; }
#trade { font-size: 30px; white-space: nowrap; font-weight: 700; }
#addr { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 27px; white-space: nowrap; margin-top: 12px; }
#phones { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 12px; font-family: "Montserrat"; font-weight: 800; font-size: 34px; white-space: nowrap; }
#phones .chip { background: var(--pAcc); color: var(--pChipInk); border-radius: 40px; padding: 6px 16px; }
#office { display: flex; justify-content: center; gap: 22px; margin-top: 10px; font-size: 26px; white-space: nowrap; }
#office .num { font-family: "Montserrat"; font-weight: 700; }
#bank { display: grid; grid-template-columns: auto auto; justify-content: center; column-gap: 40px; row-gap: 6px; text-align: left; margin-top: 16px; padding-top: 14px; }
.kv { font-family: "Montserrat"; font-size: 22px; font-weight: 600; white-space: nowrap; }
.kv b { display: inline-block; min-width: 92px; font-weight: 800; font-size: 17px; letter-spacing: 2px; color: var(--pAcc); }
.ico { width: 32px; height: 32px; flex: none; }
.ico path { fill: var(--pAcc); }

/* p0 card: coloured name band + white body */
.p0 .pbg { background: #fff; border-radius: 34px; box-shadow: 0 16px 0 var(--shadow), 0 20px 50px rgba(0,0,0,.25); overflow: hidden; }
.p0 .pbg::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 170px; background: var(--panel); }
.p0 #shop { color: var(--pAcc2); } .p0 #trade { color: #fff; }
.p0 #addr { margin-top: 26px; } .p0 #bank { border-top: 2px dashed #c9c9c9; } .p0 .kv b { color: var(--panel); } .p0 .ico path { fill: var(--panel); }
.p0 #phones .chip { background: var(--panel); color: #fff; }
/* p1 wave: full-width band with a wavy top edge */
#panel.p1 { left: 0; right: 0; bottom: 0; height: 575px; }
#panel.p1 .pin { padding-top: 80px; }
.p1 #bank { border-top: 2px solid rgba(255,255,255,.25); margin-left: 60px; margin-right: 60px; }
/* p2 ticket: inset card, dashed inner border, side notches */
.p2 .pbg { background: var(--panel); border-radius: 26px; box-shadow: 0 14px 40px rgba(0,0,0,.3); }
.p2 .pbg::after { content: ""; position: absolute; inset: 14px; border: 3px dashed var(--pAcc); border-radius: 18px; opacity: .65; }
.p2 .notch { position: absolute; top: 330px; width: 54px; height: 54px; border-radius: 50%; background: var(--bg2); }
.p2 #bank { border-top: 3px dashed rgba(255,255,255,.35); margin-left: 40px; margin-right: 40px; }
/* p3 chips: dark slab, phone numbers as pills, bank in boxes */
.p3 .pbg { background: var(--panel); border-radius: 46px 46px 34px 34px; border: 5px solid var(--pAcc); }
.p3 #bank { grid-template-columns: repeat(3, auto); column-gap: 10px; row-gap: 10px; }
.p3 .kv { border: 2px solid rgba(255,255,255,.28); border-radius: 12px; padding: 6px 12px; font-size: 19px; }
.p3 .kv b { display: block; min-width: 0; font-size: 14px; }
.p3 #phones { gap: 10px; }

/* Entrance + loop animations */
@keyframes pop { 0% { opacity: 0; transform: scale(.4); } 65% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(70px); } to { opacity: 1; transform: none; } }
@keyframes fromL { from { opacity: 0; transform: translateX(-700px); } to { opacity: 1; transform: none; } }
@keyframes fromR { from { opacity: 0; transform: translateX(700px); } to { opacity: 1; transform: none; } }
@keyframes drop { 0% { opacity: 0; transform: translateY(-500px); } 60% { opacity: 1; transform: translateY(24px); } 80% { transform: translateY(-8px); } 100% { opacity: 1; transform: none; } }
@keyframes flip { from { opacity: 0; transform: perspective(900px) rotateX(-95deg); } to { opacity: 1; transform: none; } }
@keyframes spin { from { opacity: 0; transform: rotate(-200deg) scale(.2); } to { opacity: 1; transform: none; } }
@keyframes zoom { from { opacity: 0; transform: scale(2.4); filter: blur(14px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(-50% -50% -50% -50%); } }
@keyframes up { from { opacity: 0; transform: translateY(600px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
@keyframes turn { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
@keyframes flicker { 0% { transform: scale(1, 1); } 50% { transform: scale(.92, 1.08); } 100% { transform: scale(1.05, .95); } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1s ease-in-out infinite alternate; }
.bob { animation: bob 3s ease-in-out infinite; }
.spinslow { transform-box: fill-box; transform-origin: 50% 50%; animation: turn 90s linear infinite; }
.tw { transform-box: fill-box; transform-origin: 50% 50%; animation: twinkle 2.2s ease-in-out infinite; }
.loop { display: inline-block; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <svg id="motif" width="1080" height="1920"></svg>
  <div id="main"></div>
  <div id="head"></div>
  <div id="panel"><div class="pbg"></div><div class="pin">
    <div id="shop"></div>
    <div id="trade"></div>
    <div id="addr"><svg class="ico" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="addrtext"></span></div>
    <div id="phones"></div>
    <div id="office"></div>
    <div id="bank"></div>
  </div></div>
</div>

<script>
function rng(seed) { seed = (Math.abs(seed) % 2147483646) + 1; return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

/* ---------- Palettes: bold and colourful, light and dark ---------- */
const PALETTES = [
  { bg: '#ff7a1a', bg2: '#ff4d00', ink: '#ffffff', title: '#ffffff', shadow: '#8f2400', b: '#ffd23f', c2: '#ffffff', hl: '#1d2a6b', hlInk: '#ffd23f', panel: '#1d2a6b', pAcc: '#ffd23f', pAcc2: '#ffd23f', m: 'rgba(255,255,255,.16)', dark: true },
  { bg: '#ff5fa2', bg2: '#ff3d7f', ink: '#ffffff', title: '#fff36b', shadow: '#5b1150', b: '#5b2bd6', c2: '#ffffff', hl: '#fff36b', hlInk: '#5b1150', panel: '#3b1170', pAcc: '#fff36b', pAcc2: '#fff36b', m: 'rgba(255,255,255,.18)', dark: true },
  { bg: '#ffe23d', bg2: '#ffc800', ink: '#151515', title: '#151515', shadow: '#e63946', b: '#1d4ed8', c2: '#151515', hl: '#e63946', hlInk: '#ffffff', panel: '#151515', pAcc: '#ffe23d', pAcc2: '#ffe23d', m: 'rgba(0,0,0,.08)', dark: false },
  { bg: '#2a9d8f', bg2: '#1d7a6f', ink: '#ffffff', title: '#ffffff', shadow: '#0f3d37', b: '#f4a261', c2: '#e9c46a', hl: '#f4a261', hlInk: '#2b1406', panel: '#12403a', pAcc: '#f4d35e', pAcc2: '#f4d35e', m: 'rgba(255,255,255,.12)', dark: true },
  { bg: '#1d4ed8', bg2: '#0b2a8f', ink: '#ffffff', title: '#ffd23f', shadow: '#061a5c', b: '#ff5d73', c2: '#ffd23f', hl: '#ffd23f', hlInk: '#0b2a8f', panel: '#0a1a52', pAcc: '#ffd23f', pAcc2: '#ffd23f', m: 'rgba(255,255,255,.12)', dark: true, gold: true },
  { bg: '#fff4e0', bg2: '#ffe2b3', ink: '#3a1408', title: '#c1121f', shadow: '#f4a300', b: '#f77f00', c2: '#c1121f', hl: '#c1121f', hlInk: '#fff4e0', panel: '#7a0d0d', pAcc: '#ffc94a', pAcc2: '#ffc94a', m: 'rgba(193,18,31,.10)', dark: false },
  { bg: '#c9f2e3', bg2: '#97e0c6', ink: '#073b35', title: '#0f766e', shadow: '#f97316', b: '#7c3aed', c2: '#0f766e', hl: '#f97316', hlInk: '#ffffff', panel: '#0f3d3a', pAcc: '#fdba74', pAcc2: '#fdba74', m: 'rgba(15,118,110,.12)', dark: false },
  { bg: '#3b0a6b', bg2: '#1a0433', ink: '#ffffff', title: '#ffb703', shadow: '#ff2e88', b: '#22d3ee', c2: '#ffb703', hl: '#ff2e88', hlInk: '#ffffff', panel: '#12021f', pAcc: '#ffb703', pAcc2: '#ffb703', m: 'rgba(255,183,3,.12)', dark: true, gold: true },
  { bg: '#7a0f1f', bg2: '#3b050d', ink: '#fff3d6', title: '#ffc94a', shadow: '#2a0308', b: '#ff7b54', c2: '#ffc94a', hl: '#ffc94a', hlInk: '#5a0a14', panel: '#2a0308', pAcc: '#ffc94a', pAcc2: '#ffc94a', m: 'rgba(255,201,74,.12)', dark: true, gold: true },
  { bg: '#dff3ff', bg2: '#a9dcff', ink: '#0b2545', title: '#0b5ed7', shadow: '#ffbe0b', b: '#ff6b35', c2: '#0b5ed7', hl: '#ff6b35', hlInk: '#ffffff', panel: '#0b2545', pAcc: '#ffbe0b', pAcc2: '#ffbe0b', m: 'rgba(11,94,215,.10)', dark: false },
  { bg: '#065f46', bg2: '#022c22', ink: '#f0fdf4', title: '#fde047', shadow: '#011a14', b: '#fb923c', c2: '#fde047', hl: '#fde047', hlInk: '#064e3b', panel: '#022c22', pAcc: '#fde047', pAcc2: '#fde047', m: 'rgba(253,224,71,.10)', dark: true, gold: true },
  { bg: '#1a1a1a', bg2: '#000000', ink: '#ffffff', title: '#f5c542', shadow: '#5c4300', b: '#ff6b35', c2: '#f5c542', hl: '#f5c542', hlInk: '#111111', panel: '#000000', pAcc: '#f5c542', pAcc2: '#f5c542', m: 'rgba(245,197,66,.10)', dark: true, gold: true },
  { bg: '#ff6f59', bg2: '#ef476f', ink: '#ffffff', title: '#ffffff', shadow: '#6b0f2b', b: '#06d6a0', c2: '#ffd166', hl: '#ffd166', hlInk: '#6b0f2b', panel: '#3d0c1f', pAcc: '#ffd166', pAcc2: '#ffd166', m: 'rgba(255,255,255,.15)', dark: true },
  { bg: '#ede4ff', bg2: '#cdb8ff', ink: '#2e1065', title: '#6d28d9', shadow: '#f59e0b', b: '#f43f5e', c2: '#6d28d9', hl: '#6d28d9', hlInk: '#ffffff', panel: '#2e1065', pAcc: '#fbbf24', pAcc2: '#fbbf24', m: 'rgba(109,40,217,.10)', dark: false },
  { bg: '#ff9933', bg2: '#f97300', ink: '#ffffff', title: '#ffffff', shadow: '#0b6b06', b: '#138808', c2: '#ffffff', hl: '#138808', hlInk: '#ffffff', panel: '#4a1d00', pAcc: '#ffd27a', pAcc2: '#ffd27a', m: 'rgba(255,255,255,.16)', dark: true },
  { bg: '#e8ebf0', bg2: '#c4ccd8', ink: '#111827', title: '#1e3a8a', shadow: '#b91c1c', b: '#ca8a04', c2: '#1e3a8a', hl: '#b91c1c', hlInk: '#ffffff', panel: '#1e293b', pAcc: '#e2e8f0', pAcc2: '#facc15', m: 'rgba(30,58,138,.09)', dark: false },
];

/* ---------- Display fonts per language ---------- */
const FONTS = {
  gu: [['BalooBhai', 800], ['Shrikhand', 400], ['KumarOne', 400], ['AnekGu', 800], ['MuktaVaani', 800], ['SerifGu', 900], ['Farsan', 400], ['Rasa', 700]],
  hi: [['Baloo', 800], ['Rozha', 400], ['Yatra', 400], ['AnekHi', 800], ['Mukta', 800], ['SerifHi', 900], ['Khand', 700], ['Teko', 600]],
  en: [['Anton', 400], ['Playfair', 900], ['Righteous', 400], ['Bebas', 400], ['Poppins', 800], ['Cinzel', 900], ['Baloo', 800], ['Montserrat', 900]],
};

/* ---------- Metals ---------- */
let UID = 0;
function grad(kind) {
  const id = 'm' + (UID++);
  const s = kind === 'silver' ? ['#ffffff', '#dfe3e8', '#9aa3ad'] : ['#fff3c0', '#f4c84a', '#b97b16'];
  return [id, `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${s[0]}"/><stop offset=".45" stop-color="${s[1]}"/><stop offset="1" stop-color="${s[2]}"/></linearGradient>`];
}
function coin(cx, cy, r, kind = 'gold', label = true) {
  const [id, def] = grad(kind), dark = kind === 'silver' ? '#7d858f' : '#94600f';
  return `<defs>${def}</defs><circle cx="${cx}" cy="${cy + r * .1}" r="${r}" fill="${kind === 'silver' ? '#6f7882' : '#8a5a0c'}"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})" stroke="${dark}" stroke-width="${r * .05}"/>
    <circle cx="${cx}" cy="${cy}" r="${r * .78}" fill="none" stroke="${dark}" stroke-width="${r * .035}" stroke-dasharray="${r * .06} ${r * .05}"/>
    ${label ? `<text x="${cx}" y="${cy + r * .3}" text-anchor="middle" font-family="SerifHi" font-weight="800" font-size="${r * .8}" fill="${dark}">श्री</text>` : ''}`;
}
function stack(cx, baseY, r, n, kind) {
  const top = kind === 'silver' ? '#eef1f4' : '#f6d064', side = kind === 'silver' ? '#9aa1ab' : '#b47a1f', edge = kind === 'silver' ? '#7d858f' : '#8a5a0c';
  let s = '';
  for (let i = 0; i < n; i++) {
    const y = baseY - i * r * .3;
    s += `<ellipse cx="${cx}" cy="${y + r * .15}" rx="${r}" ry="${r * .32}" fill="${side}" stroke="${edge}" stroke-width="2"/><rect x="${cx - r}" y="${y}" width="${2 * r}" height="${r * .15}" fill="${side}"/>
      <ellipse cx="${cx}" cy="${y}" rx="${r}" ry="${r * .32}" fill="${top}" stroke="${edge}" stroke-width="2"/>`;
  }
  return s;
}
function bar(x, y, w, h, kind = 'gold') {
  const [id, def] = grad(kind), dark = kind === 'silver' ? '#6f7882' : '#8a5a0c';
  return `<defs>${def}</defs><path d="M${x + w * .14} ${y} H${x + w * .86} L${x + w} ${y + h} H${x} Z" fill="url(#${id})" stroke="${dark}" stroke-width="2.5"/>
    <path d="M${x + w * .14} ${y} H${x + w * .86} L${x + w * .8} ${y + h * .32} H${x + w * .2} Z" fill="rgba(255,255,255,.4)"/>
    <text x="${x + w / 2}" y="${y + h * .8}" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="${h * .3}" fill="${dark}">${kind === 'silver' ? '999' : '999.9'}</text>`;
}
function spark(x, y, s, col, delay = 0) {
  return `<path class="tw" style="animation-delay:-${delay.toFixed(2)}s" d="M${x} ${y - s} L${x + s * .22} ${y - s * .22} L${x + s} ${y} L${x + s * .22} ${y + s * .22} L${x} ${y + s} L${x - s * .22} ${y + s * .22} L${x - s} ${y} L${x - s * .22} ${y - s * .22} Z" fill="${col}"/>`;
}
function diya(cx, cy, s) {
  const hid = 'h' + (UID++);
  return `<defs><radialGradient id="${hid}"><stop offset="0" stop-color="rgba(255,220,110,.75)"/><stop offset="1" stop-color="rgba(255,190,60,0)"/></radialGradient></defs>

        `background:${hot ? P.hl : '#ffffff'};color:${hot ? P.hlInk : '#1b1b1b'};box-shadow:0 10px 0 ${P.shadow}`, badge(icons[(i + 3) % icons.length], 108, hot ? '#ffffff' : P.hl, P.shadow));

  },
  // Title, illustration and numbered hexagon steps.
  steps(d, P, A, r, main, icons) {
    put(main, 'left:30px;right:30px;top:200px;text-align:center', T(d, d.lang === 'en' ? 116 : 124, 1000), A.title, .2, 1);
    put(main, 'left:40px;right:40px;top:356px;text-align:center', S(d, 46, 980), A.sub, .6);
    put(main, 'left:255px;top:430px', h('div', '', '', heroSvg(d.hero, P, r, 570)), A.hero, .5, 1.1);

    items.forEach((text, i) => {
      const x = 40 + i * w;
      const col = h('div', 'abs ctr', `left:${x}px;top:888px;width:${w}px`,
        `<svg width="170" height="190" viewBox="0 0 170 190"><path d="M85 8 L160 50 V140 L85 182 L10 140 V50 Z" fill="${cols[i % 3]}" stroke="${P.shadow}" stroke-width="7" stroke-linejoin="round"/>
        <text x="85" y="78" text-anchor="middle" font-family="Montserrat" font-weight="900" font-size="44" fill="#fff" stroke="${P.shadow}" stroke-width="2.5" paint-order="stroke">0${i + 1}</text>
        <g transform="translate(53,90)">${ICONS[icons[(i + 2) % icons.length]]()}</g></svg>`);
      const t = txt('div', 'line', `display:block;white-space:normal;width:${w - 34}px;margin:10px auto 0;line-height:1.28;max-height:230px`, text);

  burst(d, P, A, r, main, icons) {

    for (let i = 0; i < N * 2; i++) { const a = i / (N * 2) * Math.PI * 2, rr = i % 2 ? 310 : 350; pts += `${(540 + rr * Math.cos(a)).toFixed(1)},${(650 + rr * .82 * Math.sin(a)).toFixed(1)} `; }

    put(main, 'left:220px;width:640px;top:612px;text-align:center', T({ ...d, fx: 'fx0' }, d.lang === 'en' ? 100 : 108, 600, `color:${P.hlInk};text-shadow:0 5px 0 ${P.shadow}`), A.title, .6, 1);

  // Editorial: left-aligned headline, colour bar, illustration on a big circle to the right.

      `background:${P.dark ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.8)'};border-radius:0 16px 16px 0`, L(l, 40, 920), A.line === 'alt' ? 'fromL' : A.line, 1.2 + i * .25));

const LAYOUT_NAMES = Object.keys(LAYOUTS);

/* ---------- Headers ---------- */
function header(d, P, A, kind, onBlock) {
  const head = document.getElementById('head');
  const ink = onBlock ? P.hlInk : P.ink;
  const pill = `<div class="brandpill" style="${onBlock ? `background:${P.hlInk};color:${P.hl}` : ''}">CHHATRAPATI BULLION</div>`;
  if (kind === 0) {
    head.innerHTML = `<div class="ctr" style="padding-top:34px">${pill}<div class="bless" style="margin-top:10px;color:${ink}"></div><div class="datechip" style="margin-top:6px;color:${ink};border-color:${ink}"></div></div>`;
  } else if (kind === 1) {
    head.innerHTML = `<div style="height:92px;background:${onBlock ? P.shadow : P.hl};display:flex;align-items:center;justify-content:center;padding-top:6px"><div class="bless" style="color:${onBlock ? '#fff' : P.hlInk}"></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 44px 0"><div style="font-family:Montserrat;font-weight:800;font-size:26px;letter-spacing:6px;color:${ink}">CHHATRAPATI BULLION</div><div class="datechip" style="color:${ink};border-color:${ink}"></div></div>`;
  } else {
    head.innerHTML = `<div style="display:flex;align-items:center;gap:26px;padding:34px 48px 0"><div class="mono" style="${onBlock ? `background:${P.hlInk};color:${P.hl}` : ''}"></div>
      <div><div style="font-family:Montserrat;font-weight:800;font-size:28px;letter-spacing:7px;color:${ink}">CHHATRAPATI BULLION</div><div class="bless" style="color:${ink}"></div><div class="datechip" style="margin-top:4px;color:${ink};border-color:${ink}"></div></div></div>`;
  }
  head.querySelectorAll('.bless').forEach(e => e.textContent = d.shop.blessing);
  head.querySelectorAll('.datechip').forEach(e => e.textContent = d.date_label);
  head.querySelectorAll('.mono').forEach(e => e.textContent = { gu: 'છ', hi: 'छ', en: 'C' }[d.lang]);
  anim(head, A.head, 0, .8);
}

/* ---------- Info panel (same facts every day, four looks) ---------- */
function panel(d, P, A, kind) {
  const p = document.getElementById('panel');
  p.className = 'p' + kind;
  p.style.setProperty('--panel', P.panel); p.style.setProperty('--pAcc', P.pAcc); p.style.setProperty('--pAcc2', P.pAcc2);
  p.style.setProperty('--pInk', kind === 0 ? '#1b1b1b' : '#ffffff'); p.style.setProperty('--pChipInk', P.panel);
  const bg = p.querySelector('.pbg'); bg.innerHTML = '';
  if (kind === 1) {
    let wv = 'M0 60'; for (let x = 0; x <= 1080; x += 30) wv += ` L${x} ${(40 + 22 * Math.sin(x / 80)).toFixed(1)}`; wv += ' V575 H0 Z';
    bg.innerHTML = `<svg width="1080" height="575"><path d="${wv}" fill="${P.pAcc}" transform="translate(0,-12)"/><path d="${wv}" fill="${P.panel}"/></svg>`;
  }
  if (kind === 2) bg.innerHTML = '<div class="notch" style="left:-27px"></div><div class="notch" style="right:-27px"></div>';
  document.getElementById('shop').textContent = d.shop.name;
  document.getElementById('trade').textContent = d.shop.line1 + '  •  ' + d.shop.line2;
  document.getElementById('addrtext').textContent = d.shop.addr;
  const PH = '<svg class="ico" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
  document.getElementById('phones').innerHTML = (kind === 0 || kind === 3)
    ? PH + d.mobiles.map(m => `<span class="chip">${m}</span>`).join('')
    : PH + d.mobiles.map(m => `<span>${m}</span>`).join('<span style="opacity:.55">|</span>');
  document.getElementById('office').innerHTML = `<span>${d.labels.office}: <span class="num">${d.landlines.join(', ')}</span></span><span>•</span><span>${d.shop.owner}</span>`;
  const b = d.bank;
  document.getElementById('bank').innerHTML = [['GSTIN', b.gst], ['BANK', b.bank], ['A/C NO', b.account], ['BRANCH', b.branch], ['IFSC', b.ifsc], ['NAME', b.name]]
    .map(([k, v]) => `<div class="kv"><b>${k}</b>${v}</div>`).join('');
  anim(p, A.panel, .15, 1);
}

window.render = async (d) => {
  const g = d.design, r = rng(d.seed * 7 + 13);
  const P = PALETTES[g.palette % PALETTES.length];
  const A = ANIMS[g.anim % ANIMS.length];
  const layout = LAYOUT_NAMES[g.layout % LAYOUT_NAMES.length];
  const [fam, wt] = FONTS[d.lang][g.font % FONTS[d.lang].length];
  document.body.className = d.lang + ' L-' + layout;
  const root = document.documentElement.style;
  for (const k of ['bg', 'bg2', 'ink', 'title', 'shadow', 'b', 'c2', 'hl', 'hlInk']) root.setProperty('--' + k, P[k]);
  root.setProperty('--disp', `"${fam}", "Poppins", sans-serif`); root.setProperty('--dispw', wt);
  let fx = ['fx0', 'fx1', 'fx2', 'fx3'][g.fx % 4];
  if (fx === 'fx2' && !P.gold) fx = P.dark ? 'fx0' : 'fx1';
  const hero = (HERO_SETS[d.decor] || HERO_SETS.coins)[g.hero % 6];
  d = { ...d, fx, hero };

  document.getElementById('motif').innerHTML = MOTIFS[g.bg % MOTIFS.length](P.m, r);
  const icons = ICON_NAMES.filter(n => n !== 'diya' || d.decor === 'diyas' || d.decor === 'both').sort(() => r() - .5);
  const main = document.getElementById('main'); main.innerHTML = ''; FITS.length = 0;
  LAYOUTS[layout](d, P, A, r, main, icons);
  header(d, P, A, g.header % 3, layout === 'wave');
  panel(d, P, A, g.panel % 4);
  main.querySelectorAll('.offer').forEach(o => { o.style.animation = 'pulse 1.6s 3s ease-in-out infinite'; });

  document.body.offsetHeight;
  await document.fonts.ready;
  window.seek(6000);  // measure the settled layout, not mid-animation
  for (const [el, w, size, boxH] of FITS) { if (boxH) fitBox(el, boxH, size); else fit(el, w, size); }
  fit(document.getElementById('shop'), 940, d.lang === 'en' ? 70 : 76);
  fit(document.getElementById('trade'), 940, 30);
  fit(document.getElementById('addr'), 940, 27);
  fit(document.getElementById('phones'), 960, 34);
  fit(document.getElementById('office'), 940, 26);
  return { layout, palette: g.palette % PALETTES.length, font: fam, hero, fx };
};

window.seek = (ms) => {
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; }
};
