<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "SerifGu"; src: url("fonts/NotoSerifGujarati.ttf"); font-weight: 100 900; }
@font-face { font-family: "SerifHi"; src: url("fonts/NotoSerifDevanagari.ttf"); font-weight: 100 900; }
@font-face { font-family: "SansGu"; src: url("fonts/HindVadodara-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "SansGu"; src: url("fonts/HindVadodara-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "SansHi"; src: url("fonts/Hind-SemiBold.ttf"); font-weight: 600; }
@font-face { font-family: "SansHi"; src: url("fonts/Hind-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Cormorant"; src: url("fonts/CormorantGaramond.ttf"); font-weight: 300 700; }
@font-face { font-family: "Cormorant"; src: url("fonts/CormorantGaramond-Italic.ttf"); font-weight: 300 700; font-style: italic; }
@font-face { font-family: "Cinzel"; src: url("fonts/Cinzel.ttf"); font-weight: 400 900; }
@font-face { font-family: "Montserrat"; src: url("fonts/Montserrat.ttf"); font-weight: 100 900; }

:root {
  --bg1: #5a0b14; --bg2: #1a0306; --glow: rgba(255, 170, 60, .28);
  --gold: linear-gradient(180deg, #fff3c4 0%, #f5d27a 28%, #d4a23c 55%, #f7dc8e 78%, #b8862b 100%);
  --gold-flat: #e9c46a; --cream: #fdf3dc;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
body { font-family: var(--sans); color: var(--cream); }
body.gu { --serif: "SerifGu", "Cormorant", serif; --sans: "SansGu", "Montserrat", sans-serif; }
body.hi { --serif: "SerifHi", "Cormorant", serif; --sans: "SansHi", "Montserrat", sans-serif; }
body.en { --serif: "Cormorant", serif; --sans: "Montserrat", sans-serif; }
body.en #title, body.en #shop { font-family: "Cinzel"; font-weight: 700; letter-spacing: 2px; }
body.en .line { font-family: "Cormorant"; font-weight: 700; font-size: 50px; }
body.en #offer { font-family: "Montserrat"; font-weight: 700; }
body.en #trade, body.en #addr, body.en #office { font-family: "Montserrat"; font-weight: 500; }
body.en #mono { font-family: "Cinzel"; font-weight: 700; padding-top: 0; }

#stage { position: absolute; inset: 0; overflow: hidden; }
#bg { position: absolute; inset: -40px;
  background:
    radial-gradient(ellipse 70% 38% at 50% 40%, var(--glow), transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 30%, var(--bg1) 0%, var(--bg2) 75%);
  animation: bgzoom 8s linear both; }
#pattern { position: absolute; inset: 0; opacity: .13; }
#grain { position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay; }
@keyframes bgzoom { from { transform: scale(1); } to { transform: scale(1.06); } }

.frame { position: absolute; inset: 26px; border: 2px solid rgba(233, 196, 106, .75); border-radius: 6px; pointer-events: none; }
.frame.inner { inset: 38px; border-width: 1px; border-color: rgba(233, 196, 106, .35); }
.corner { position: absolute; width: 120px; height: 120px; }
.corner.tl { left: 14px; top: 14px; } .corner.tr { right: 14px; top: 14px; transform: scaleX(-1); }
.corner.bl { left: 14px; bottom: 14px; transform: scaleY(-1); } .corner.br { right: 14px; bottom: 14px; transform: scale(-1, -1); }

/* Padding keeps tall matras (ि, ी) inside the painted gradient box. */
.goldtext { background: var(--gold); -webkit-background-clip: text; background-clip: text; color: transparent; padding: .22em .06em .06em; }
#shop.goldtext, #brand.goldtext { padding-top: .22em; margin-top: -.22em; }
#titletext { background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.9) 50%, transparent 58%), var(--gold);
  background-size: 300% 100%, 100% 100%; background-repeat: no-repeat; -webkit-background-clip: text; background-clip: text;
  animation: shine 3.2s 1.6s infinite both; }

/* Header */
#head { position: absolute; top: 70px; left: 0; right: 0; text-align: center; animation: fadeDown 1s .1s both; }
#mono { width: 92px; height: 92px; margin: 0 auto; border-radius: 50%; background: var(--gold);
  box-shadow: 0 6px 24px rgba(0,0,0,.45), inset 0 0 0 3px rgba(120, 80, 10, .55), inset 0 0 0 7px rgba(255,240,200,.5);
  display: flex; align-items: center; justify-content: center; font-family: var(--serif); font-weight: 800; font-size: 54px; color: #4a2a05; padding-top: 4px; }
#brand { margin-top: 16px; font-family: "Cinzel"; font-weight: 700; font-size: 30px; letter-spacing: 11px; padding-left: 11px; }
#bless { margin-top: 8px; font-size: 26px; color: rgba(253, 243, 220, .85); }
#date { margin-top: 18px; font-family: "Montserrat"; font-weight: 600; font-size: 21px; letter-spacing: 7px; color: rgba(233, 196, 106, .9); }

/* Hero text */
#titlewrap { position: absolute; top: 352px; left: 60px; right: 60px; text-align: center; }
#title { position: relative; display: inline-block; font-family: var(--serif); font-weight: 800; line-height: 1.0;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)); animation: rise 1.1s .35s both; white-space: nowrap; }
@keyframes shine { 0% { background-position: 150% 0, 0 0; } 45%, 100% { background-position: -60% 0, 0 0; } }
#en { margin-top: 2px; font-family: "Cormorant"; font-style: italic; font-weight: 500; font-size: 62px; color: var(--cream); letter-spacing: 1px;
  animation: rise 1s .7s both; }
#divider { width: 520px; height: 34px; margin: 14px auto 0; animation: fade 1s 1s both; }

/* Illustration */
#hero { position: absolute; top: 672px; left: 0; right: 0; height: 430px; display: flex; justify-content: center; align-items: flex-end;
  animation: zoomIn 1.2s .8s both; }
#hero svg { overflow: visible; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flicker 1.1s ease-in-out infinite alternate; }
.flame.b { animation-duration: .9s; animation-delay: -.4s; } .flame.c { animation-duration: 1.3s; animation-delay: -.7s; }
@keyframes flicker { 0% { transform: scale(1, 1) skewX(0deg); } 50% { transform: scale(.94, 1.07) skewX(2deg); } 100% { transform: scale(1.04, .95) skewX(-2deg); } }
.coinshine { animation: coinshine 3s 1.8s infinite; }
@keyframes coinshine { 0% { transform: translateX(-260px); } 40%, 100% { transform: translateX(260px); } }

/* Message */
#msg { position: absolute; top: 1118px; left: 70px; right: 70px; text-align: center; }
.line { font-weight: 600; font-size: 46px; line-height: 1.35; color: var(--cream); text-shadow: 0 3px 10px rgba(0,0,0,.5); white-space: nowrap; }
.line:nth-child(1) { animation: rise .9s 1.5s both; } .line:nth-child(2) { animation: rise .9s 1.8s both; }
#offer { display: inline-block; margin-top: 16px; padding: 12px 44px 8px; border-radius: 60px; background: var(--gold);
  color: #3d1d02; font-weight: 700; font-size: 38px; box-shadow: 0 8px 26px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.35);
  white-space: nowrap; animation: pop .8s 2.2s both; }

/* Info panel */
#panel { position: absolute; left: 50px; right: 50px; bottom: 50px; height: 494px; border-radius: 28px;
  background: linear-gradient(180deg, rgba(10, 6, 4, .78), rgba(10, 6, 4, .9)); border: 1.5px solid rgba(233, 196, 106, .7);
  box-shadow: 0 -10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255, 230, 160, .15); padding: 26px 36px 0; text-align: center;
  animation: slideUp 1s .2s both; }
#shop { font-family: var(--serif); font-weight: 800; font-size: 78px; line-height: 1.0; white-space: nowrap; }
#trade { margin-top: 2px; font-size: 30px; color: var(--gold-flat); white-space: nowrap; }
.rule { height: 1px; margin: 18px 10px; background: linear-gradient(90deg, transparent, rgba(233,196,106,.7), transparent); }
#addr { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 27px; color: var(--cream); white-space: nowrap; }
#phones { margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 14px; font-family: "Montserrat"; font-weight: 700; font-size: 35px; color: #fff; white-space: nowrap; }
#phones .sep { color: var(--gold-flat); font-weight: 400; }
#office { margin-top: 8px; display: flex; justify-content: center; gap: 22px; font-size: 26px; color: rgba(253,243,220,.85); white-space: nowrap; }
#office .num { font-family: "Montserrat"; font-weight: 600; letter-spacing: .5px; }
#bank { display: grid; grid-template-columns: auto auto; justify-content: center; column-gap: 46px; row-gap: 6px; text-align: left; }
.kv { font-family: "Montserrat"; font-size: 22px; color: #fff; font-weight: 600; white-space: nowrap; }
.kv b { display: inline-block; min-width: 92px; font-weight: 700; font-size: 17px; letter-spacing: 2px; color: var(--gold-flat); }
.icon { width: 30px; height: 30px; flex: none; }

/* Sparkles */
.spark { position: absolute; width: 22px; height: 22px; animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6) rotate(0); } 50% { opacity: 1; transform: scale(1) rotate(20deg); } }

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
@keyframes zoomIn { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.7); } 70% { transform: scale(1.06); } 100% { opacity: 1; transform: none; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(80px); } to { opacity: 1; transform: none; } }

/* ---------- Rotating styles (body.s-*) : the default rules above are "royal" ---------- */
#toran, #arch { display: none; position: absolute; }
@keyframes slideRight { from { opacity: 0; transform: translateX(-120px); } to { opacity: 1; transform: none; } }
@keyframes slideLeft { from { opacity: 0; transform: translateX(120px); } to { opacity: 1; transform: none; } }
@keyframes drop { 0% { opacity: 0; transform: translateY(-160px); } 70% { transform: translateY(10px); } 100% { opacity: 1; transform: none; } }
@keyframes swing { 0%, 100% { transform: rotate(-1.2deg); } 50% { transform: rotate(1.2deg); } }
@keyframes archIn { from { opacity: 0; transform: scaleY(.6); } to { opacity: 1; transform: none; } }
@keyframes spread { from { opacity: 0; letter-spacing: 30px; } to { opacity: 1; } }

/* Ivory: light paper, maroon ink, gold-bar pyramid, text slides in from the side. */
body.s-ivory { --cream: #4a0d12; --gold-flat: #9b6a17;
  --gold: linear-gradient(180deg, #c48a23 0%, #8a5a10 45%, #b98022 70%, #6e440a 100%); }
body.s-ivory #bg { background: radial-gradient(ellipse 80% 45% at 50% 42%, #fffaf0 0%, #f6e8cc 60%, #e9d3a8 100%); animation: none; }
body.s-ivory #pattern { opacity: .16; filter: hue-rotate(-30deg) saturate(2) brightness(.45); }
body.s-ivory #grain { opacity: .05; mix-blend-mode: multiply; }
body.s-ivory .frame { border-color: rgba(110, 20, 28, .7); }
body.s-ivory .frame.inner { border-color: rgba(155, 106, 23, .5); }
body.s-ivory .corner g { stroke: #7a1420; } body.s-ivory .corner path[fill], body.s-ivory .corner circle { fill: #7a1420; }
body.s-ivory #bless { color: #5a1a1a; } body.s-ivory #date { color: #7a1420; }
body.s-ivory #mono { color: #fff4d6; background: linear-gradient(180deg, #8a1a24, #4a0a10); }
body.s-ivory #title { filter: drop-shadow(0 3px 2px rgba(120, 60, 0, .25)); animation-name: slideRight; }
body.s-ivory #en { color: #7a1420; animation-name: slideLeft; }
body.s-ivory #divider g { stroke: #7a1420; } body.s-ivory #divider [fill] { fill: #7a1420; }
body.s-ivory .line { color: #3d0a0e; text-shadow: none; }
body.s-ivory #offer { background: linear-gradient(180deg, #8a1a24, #5a0b14); color: #ffe9b0; }
body.s-ivory #panel { background: linear-gradient(180deg, #6b0f1a, #3d070d); border-color: #c9962e; }
body.s-ivory #panel { --cream: #fdf3dc; --gold-flat: #f2cf7a;
  --gold: linear-gradient(180deg, #fff3c4 0%, #f5d27a 40%, #d4a23c 70%, #f7dc8e 100%); }
body.s-ivory .spark path { fill: #c48a23; }

/* Arch: temple-arch window holding the illustration, title below it, curtain-like reveal. */
body.s-arch #arch { display: block; left: 170px; top: 312px; width: 740px; height: 610px; border-radius: 390px 390px 24px 24px;
  background: radial-gradient(ellipse 70% 60% at 50% 55%, rgba(255, 214, 140, .35), rgba(0, 0, 0, .25));
  border: 3px solid #e9c46a; box-shadow: 0 0 0 10px rgba(233, 196, 106, .18), 0 30px 60px rgba(0,0,0,.45), inset 0 0 60px rgba(0,0,0,.35);
  transform-origin: 50% 100%; animation: archIn 1.2s .2s both; }
body.s-arch #pattern { opacity: .08; }
body.s-arch #hero { top: 420px; transform-origin: 50% 100%; } body.s-arch #hero svg { transform: scale(.92); transform-origin: 50% 100%; }
body.s-arch #titlewrap { top: 992px; }
body.s-arch #title { animation-name: drop; }
body.s-arch #en { font-size: 52px; }
body.s-arch #divider { display: none; }
body.s-arch #msg { top: 1212px; }
body.s-arch .line { font-size: 38px; line-height: 1.22; }
body.s-arch #offer { position: absolute; left: 50%; top: -350px; transform: translateX(-50%); animation: none; opacity: 1; }
body.s-arch #head { top: 56px; }

/* Silver: steel and charcoal, silver foil lettering, silver coins and bars. */
body.s-silver { --cream: #eef2f7; --gold-flat: #c9d2dd;
  --gold: linear-gradient(180deg, #ffffff 0%, #dfe5ec 30%, #9aa6b4 58%, #eef2f6 80%, #8792a0 100%); }
body.s-silver #bg { background: radial-gradient(ellipse 70% 40% at 50% 42%, rgba(160, 190, 230, .25), transparent 70%),
  radial-gradient(ellipse 120% 80% at 50% 30%, #2c3a4c 0%, #0a0e14 78%); }
body.s-silver #pattern { filter: grayscale(1) brightness(1.6); }
body.s-silver .frame { border-color: rgba(200, 210, 222, .75); } body.s-silver .frame.inner { border-color: rgba(200, 210, 222, .3); }
body.s-silver .corner g { stroke: #c9d2dd; } body.s-silver .corner path[fill], body.s-silver .corner circle { fill: #c9d2dd; }
body.s-silver #date { color: #c9d2dd; } body.s-silver #mono { color: #2b3440; }
body.s-silver #divider g { stroke: #c9d2dd; } body.s-silver #divider [fill] { fill: #c9d2dd; }
body.s-silver #offer { color: #1d2530; }
body.s-silver #panel { border-color: rgba(200, 210, 222, .7); background: linear-gradient(180deg, rgba(8, 12, 18, .8), rgba(8, 12, 18, .92)); }
body.s-silver .icon path { fill: #c9d2dd; }
body.s-silver .spark path { fill: #e6eef8; }
body.s-silver #hero { animation-name: zoomIn; animation-duration: 1.6s; }

/* Festive: bright magenta-to-saffron sky, swinging marigold toran, rangoli wheel. */
body.s-festive #bg { background: radial-gradient(ellipse 70% 40% at 50% 45%, rgba(255, 220, 120, .35), transparent 70%),
  linear-gradient(170deg, #7b0f4f 0%, #b0242f 48%, #d8641a 100%); }
body.s-festive #pattern { opacity: .2; }
body.s-festive #toran { display: block; left: 0; top: 0; width: 1080px; height: 150px; transform-origin: 50% 0; animation: swing 4s ease-in-out infinite; }
body.s-festive .frame, body.s-festive .frame.inner, body.s-festive .corner { display: none; }
body.s-festive #head { top: 178px; }
body.s-festive #mono { display: none; }
body.s-festive #brand { margin-top: 0; }
body.s-festive #titlewrap { top: 352px; }
body.s-festive #title { filter: drop-shadow(0 5px 0 rgba(90, 10, 30, .65)); animation-name: pop; }
body.s-festive #en { color: #fff3c4; }
body.s-festive #hero { top: 672px; }
body.s-festive #panel { background: rgba(40, 4, 18, .86); }

/* Minimal: flat black, left-aligned editorial type, single large coin, info set as clean lines. */
body.s-minimal #bg { background: radial-gradient(ellipse 60% 35% at 70% 50%, rgba(233, 196, 106, .12), transparent 70%), #0b0a09; animation: none; }
body.s-minimal #pattern, body.s-minimal #sparks, body.s-minimal .frame.inner, body.s-minimal .corner { display: none; }
body.s-minimal .frame { inset: 34px; border-width: 1px; border-color: rgba(233, 196, 106, .45); border-radius: 0; }
body.s-minimal #head { left: 90px; right: 90px; text-align: left; display: grid; grid-template-columns: auto 1fr; column-gap: 24px; align-items: center; }
body.s-minimal #mono { grid-row: span 3; margin: 0; width: 110px; height: 110px; }
body.s-minimal #brand, body.s-minimal #bless, body.s-minimal #date { margin-top: 4px; padding-left: 0; }
body.s-minimal #titlewrap { top: 330px; left: 90px; right: 90px; text-align: left; }
body.s-minimal #title { animation-name: spread; animation-duration: 1.4s; }
body.s-minimal #en { text-align: left; }
body.s-minimal #divider { margin-left: 0; width: 360px; }
body.s-minimal #hero { top: 650px; }
body.s-minimal #msg { left: 90px; right: 90px; text-align: left; }
body.s-minimal .line { text-shadow: none; animation-name: slideRight; }
body.s-minimal #offer { border-radius: 0; background: none; color: var(--gold-flat); box-shadow: none; border: 2px solid var(--gold-flat); padding: 10px 30px 6px; }
body.s-minimal #panel { left: 70px; right: 70px; border-radius: 0; background: none; border: none; border-top: 2px solid rgba(233, 196, 106, .8); box-shadow: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <svg id="pattern" width="1080" height="1920"></svg>
  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div id="arch"></div>
  <svg id="toran" viewBox="0 0 1080 150"></svg>
  <div id="sparks"></div>
  <div class="frame"></div><div class="frame inner"></div>
  <svg class="corner tl" viewBox="0 0 120 120"><g fill="none" stroke="#e9c46a" stroke-width="2"><path d="M12 70 V12 H70"/><path d="M22 52 Q22 22 52 22"/><circle cx="12" cy="12" r="5" fill="#e9c46a"/><path d="M30 40 q10 -10 20 0 q-10 10 -20 0z" fill="#e9c46a" stroke="none"/></g></svg>
  <svg class="corner tr" viewBox="0 0 120 120"><g fill="none" stroke="#e9c46a" stroke-width="2"><path d="M12 70 V12 H70"/><path d="M22 52 Q22 22 52 22"/><circle cx="12" cy="12" r="5" fill="#e9c46a"/><path d="M30 40 q10 -10 20 0 q-10 10 -20 0z" fill="#e9c46a" stroke="none"/></g></svg>

  <div id="head">
    <div id="mono"></div>
    <div id="brand" class="goldtext">CHHATRAPATI BULLION</div>
    <div id="bless"></div>
    <div id="date"></div>
  </div>

  <div id="titlewrap">
    <div id="title"><span class="goldtext" id="titletext"></span></div>
    <div id="en"></div>
    <svg id="divider" viewBox="0 0 520 34"><g stroke="#e9c46a" fill="none" stroke-width="1.6"><path d="M10 17 H210"/><path d="M310 17 H510"/><path d="M260 3 L276 17 L260 31 L244 17 Z" fill="#e9c46a"/><circle cx="226" cy="17" r="4" fill="#e9c46a"/><circle cx="294" cy="17" r="4" fill="#e9c46a"/></g></svg>
  </div>

  <div id="hero"></div>

  <div id="msg"><div id="lines"></div><div id="offer"></div></div>

  <div id="panel">
    <div id="shop" class="goldtext"></div>
    <div id="trade"></div>
    <div class="rule"></div>
    <div id="addr"><svg class="icon" viewBox="0 0 24 24"><path fill="#e9c46a" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span id="addrtext"></span></div>
    <div id="phones"></div>
    <div id="office"></div>
    <div class="rule"></div>
    <div id="bank"></div>
  </div>
</div>

<script>
const PHONE = '<svg class="icon" viewBox="0 0 24 24"><path fill="#e9c46a" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
const STAR = '<svg viewBox="0 0 24 24"><path fill="#ffe7a3" d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>';

function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

function coin(cx, cy, r, silver, label) {
  const id = 'g' + Math.round(cx) + Math.round(cy) + (silver ? 's' : 'g');
  const c = silver ? ['#ffffff', '#d9dde3', '#9aa1ab', '#eef0f3'] : ['#fff1b8', '#f2c94c', '#b7791f', '#ffe08a'];
  return `<defs><radialGradient id="${id}" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="${c[0]}"/><stop offset=".45" stop-color="${c[1]}"/><stop offset="1" stop-color="${c[2]}"/></radialGradient></defs>
    <circle cx="${cx}" cy="${cy + r * .08}" r="${r}" fill="rgba(0,0,0,.35)"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})" stroke="${c[3]}" stroke-width="${r * .06}"/>
    <circle cx="${cx}" cy="${cy}" r="${r * .8}" fill="none" stroke="${silver ? '#8a919b' : '#9a6412'}" stroke-width="${r * .035}" stroke-dasharray="${r * .05} ${r * .05}"/>
    <circle cx="${cx}" cy="${cy}" r="${r * .7}" fill="none" stroke="${silver ? '#a5acb6' : '#c28a2c'}" stroke-width="${r * .02}"/>
    ${label ? `<text x="${cx}" y="${cy + r * .28}" text-anchor="middle" font-family="SerifHi" font-weight="800" font-size="${r * .82}" fill="${silver ? '#7d848e' : '#94600f'}">श्री</text>` : ''}`;
}

function stack(cx, baseY, r, n, silver) {
  let s = '';
  const top = silver ? '#e9ecf0' : '#f5cf62', side = silver ? '#9aa1ab' : '#b47a1f', edge = silver ? '#c3c8cf' : '#d9a63a';
  for (let i = 0; i < n; i++) {
    const y = baseY - i * r * .28;
    s += `<ellipse cx="${cx}" cy="${y + r * .14}" rx="${r}" ry="${r * .32}" fill="${side}"/>
          <rect x="${cx - r}" y="${y}" width="${2 * r}" height="${r * .14}" fill="${side}"/>
          <ellipse cx="${cx}" cy="${y}" rx="${r}" ry="${r * .32}" fill="${top}" stroke="${edge}" stroke-width="2"/>`;
  }
  return s;
}

function bar(x, y, w, h) {
  return `<defs><linearGradient id="bar" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b3"/><stop offset=".5" stop-color="#e7b743"/><stop offset="1" stop-color="#a86d16"/></linearGradient></defs>
    <path d="M${x + w * .12} ${y} H${x + w * .88} L${x + w} ${y + h} H${x} Z" fill="url(#bar)" stroke="#fff3c4" stroke-width="2"/>
    <path d="M${x + w * .12} ${y} H${x + w * .88} L${x + w * .8} ${y + h * .3} H${x + w * .2} Z" fill="rgba(255,255,255,.35)"/>
    <text x="${x + w / 2}" y="${y + h * .78}" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="${h * .32}" fill="#8a5a10">999.9</text>`;
}

function diya(cx, cy, s, cls) {
  return `<g>
    <ellipse cx="${cx + s * .1}" cy="${cy - s * .75}" rx="${s * .9}" ry="${s * 1.1}" fill="url(#halo)"/>
    <path class="flame ${cls}" d="M${cx + s * .1} ${cy - s * 1.15} C ${cx + s * .42} ${cy - s * .7}, ${cx + s * .32} ${cy - s * .2}, ${cx + s * .1} ${cy - s * .18} C ${cx - s * .12} ${cy - s * .2}, ${cx - s * .22} ${cy - s * .7}, ${cx + s * .1} ${cy - s * 1.15} Z" fill="url(#flame)"/>
    <path d="M${cx - s} ${cy - s * .12} Q ${cx} ${cy + s * .95} ${cx + s} ${cy - s * .12} Q ${cx + s * .55} ${cy - s * .02} ${cx + s * .32} ${cy - s * .2} L ${cx - s * .32} ${cy - s * .2} Q ${cx - s * .55} ${cy - s * .02} ${cx - s} ${cy - s * .12} Z" fill="url(#clay)" stroke="#ffd98a" stroke-width="2.5"/>
    <path d="M${cx - s * .7} ${cy + s * .12} Q ${cx} ${cy + s * .5} ${cx + s * .7} ${cy + s * .12}" fill="none" stroke="#ffd98a" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  </g>`;
}

const DIYA_DEFS = `<defs>
  <radialGradient id="halo"><stop offset="0" stop-color="rgba(255,200,90,.55)"/><stop offset="1" stop-color="rgba(255,160,40,0)"/></radialGradient>
  <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff8d6"/><stop offset=".35" stop-color="#ffd24a"/><stop offset=".8" stop-color="#ff7a1a"/><stop offset="1" stop-color="#e2470c"/></linearGradient>
  <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0782a"/><stop offset="1" stop-color="#7a2a08"/></linearGradient>
  <clipPath id="bigcoin"><circle cx="540" cy="190" r="150"/></clipPath>
</defs>`;

function barPyramid() {
  let s = '';
  const w = 230, h = 92;
  [[4, 330], [3, 232], [2, 134], [1, 36]].forEach(([n, y]) => {
    for (let i = 0; i < n; i++) s += bar(540 - (n * (w - 12)) / 2 + i * (w - 12), y, w, h);
  });
  return s;
}

function toranSvg() {
  // Marigold garland with mango leaves hanging along the top edge.
  let s = '<path d="M0 24 Q270 70 540 24 Q810 70 1080 24" fill="none" stroke="#2f7d32" stroke-width="6"/>';
  for (let i = 0; i <= 26; i++) {
    const x = i * (1080 / 26), t = (x % 540) / 540, y = 24 + 46 * 4 * t * (1 - t) * .5 + 10;
    const len = i % 2 ? 4 : 6;
    for (let k = 0; k < len; k++) {
      const col = k % 2 ? '#ffb300' : '#ff7b00';
      s += `<circle cx="${x}" cy="${y + k * 17}" r="10" fill="${col}" stroke="#c45500" stroke-width="1.5"/>`;
    }
    if (i % 2 === 0) s += `<path d="M${x} ${y + len * 17} q-14 22 0 44 q14 -22 0 -44z" fill="#3c9a3f" stroke="#1f5e22" stroke-width="1.5"/>`;
  }
  return s;
}

function heroSvg(decor, style) {
  let s = DIYA_DEFS;
  // Regular-day illustrations change with the style; festival diyas stay.
  if (decor === 'coins' || decor === 'plain') {
    if (style === 'ivory') return `<svg width="1080" height="430" viewBox="0 0 1080 430">${s + barPyramid()}</svg>`;
    if (style === 'silver') {
      s += stack(250, 360, 92, 8, true) + stack(830, 360, 92, 5, true) + bar(330, 330, 160, 72) + bar(590, 330, 160, 72);
      s += coin(540, 190, 150, true, true) + `<g clip-path="url(#bigcoin)"><rect class="coinshine" x="470" y="0" width="70" height="400" fill="rgba(255,255,255,.5)" transform="skewX(-20)"/></g>`;
      return `<svg width="1080" height="430" viewBox="0 0 1080 430">${s}</svg>`;
    }
    if (style === 'minimal') {
      s += coin(700, 200, 190, false, true) + stack(330, 380, 110, 6, true);
      return `<svg width="1080" height="430" viewBox="0 0 1080 430">${s}</svg>`;
    }
    if (style === 'arch') decor = 'plain';
  }
  const shine = `<g clip-path="url(#bigcoin)"><rect class="coinshine" x="470" y="0" width="70" height="400" fill="rgba(255,255,255,.45)" transform="skewX(-20)"/></g>`;
  if (decor === 'coins') {
    s += stack(250, 360, 92, 7, true) + stack(830, 360, 92, 7, false) + bar(330, 330, 160, 72) + bar(590, 330, 160, 72);
    s += coin(540, 190, 150, false, true) + shine;
  } else if (decor === 'diyas') {
    s += coin(540, 160, 132, false, true) + `<g clip-path="url(#bigcoin)" transform="translate(0,-30)"><rect class="coinshine" x="470" y="0" width="70" height="400" fill="rgba(255,255,255,.45)" transform="skewX(-20)"/></g>`;
    s += diya(200, 380, 78, 'b') + diya(380, 400, 92, 'c') + diya(700, 400, 92, '') + diya(880, 380, 78, 'b');
  } else if (decor === 'both') {
    s += stack(230, 380, 80, 6, true) + stack(850, 380, 80, 6, false);
    s += coin(540, 175, 140, false, true) + `<g clip-path="url(#bigcoin)" transform="translate(0,-15)"><rect class="coinshine" x="470" y="0" width="70" height="400" fill="rgba(255,255,255,.45)" transform="skewX(-20)"/></g>`;
    s += diya(420, 410, 70, 'c') + diya(660, 410, 70, '');
  } else {
    let rays = '';
    for (let i = 0; i < 36; i++) rays += `<rect x="538" y="-40" width="4" height="70" fill="rgba(255,215,120,.35)" transform="rotate(${i * 10} 540 190)"/>`;
    s += rays + coin(540, 190, 160, false, true) + shine;
  }
  return `<svg width="1080" height="430" viewBox="0 0 1080 430">${s}</svg>`;
}

function patternSvg() {
  // Fine mandala line-work behind the illustration.
  let p = '';
  const cx = 540, cy = 900;
  for (const [r, n] of [[430, 48], [340, 36], [250, 24]]) {
    p += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#f3d27a" stroke-width="1.2"/>`;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
      p += `<ellipse cx="${x}" cy="${y}" rx="${r * .09}" ry="${r * .035}" transform="rotate(${a * 180 / Math.PI} ${x} ${y})" fill="none" stroke="#f3d27a" stroke-width="1.2"/>`;
    }
  }
  return p;
}

function contentWidth(el) {
  const r = document.createRange();
  r.selectNodeContents(el);
  return r.getBoundingClientRect().width;
}

function fit(el, maxWidth, size) {
  el.style.fontSize = size + 'px';
  while (contentWidth(el) > maxWidth && size > 16) { size -= 2; el.style.fontSize = size + 'px'; }
}

window.render = async (d) => {
  document.body.className = d.lang + ' s-' + (d.style || 'royal');
  document.getElementById('toran').innerHTML = toranSvg();
  const r = document.documentElement.style;
  r.setProperty('--bg1', d.palette.bg1); r.setProperty('--bg2', d.palette.bg2); r.setProperty('--glow', d.palette.glow);
  document.getElementById('pattern').innerHTML = patternSvg();
  document.getElementById('mono').textContent = { gu: 'છ', hi: 'छ', en: 'C' }[d.lang];
  document.getElementById('bless').textContent = d.shop.blessing;
  document.getElementById('date').textContent = d.date_label;
  document.getElementById('titletext').textContent = d.title;
  document.getElementById('en').textContent = d.en;
  document.getElementById('hero').innerHTML = heroSvg(d.decor, d.style || 'royal');
  document.getElementById('lines').innerHTML = d.lines.map(l => `<div class="line"></div>`).join('');
  [...document.querySelectorAll('.line')].forEach((el, i) => { el.textContent = d.lines[i]; });
  const offer = document.getElementById('offer');
  offer.textContent = d.offer || ''; offer.style.display = d.offer ? '' : 'none';
  document.getElementById('shop').textContent = d.shop.name;
  document.getElementById('trade').textContent = d.shop.line1 + '  •  ' + d.shop.line2;
  document.getElementById('addrtext').textContent = d.shop.addr;
  document.getElementById('phones').innerHTML = PHONE + d.mobiles.map(m => `<span>${m}</span>`).join('<span class="sep">|</span>');
  document.getElementById('office').innerHTML = `<span>${d.labels.office}: <span class="num">${d.landlines.join(', ')}</span></span><span>•</span><span>${d.shop.owner}</span>`;
  const b = d.bank;
  document.getElementById('bank').innerHTML = [
    ['GSTIN', b.gst], ['BANK', b.bank], ['A/C NO', b.account], ['BRANCH', b.branch], ['IFSC', b.ifsc], ['NAME', b.name],
  ].map(([k, v]) => `<div class="kv"><b>${k}</b>${v}</div>`).join('');

  const rand = rng(d.seed || 7);
  let sp = '';
  for (let i = 0; i < 26; i++) {
    // Keep sparkles in the side margins and around the illustration, away from the text.
    const side = rand() < .5 ? 50 + rand() * 110 : 920 + rand() * 110;
    const y = 60 + rand() * 1260, inHero = y > 690 && y < 1080;
    const x = inHero ? 60 + rand() * 960 : side, s = 10 + rand() * 20;
    sp += `<div class="spark" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;animation-delay:-${(rand() * 2.4).toFixed(2)}s">${STAR}</div>`;
  }
  document.getElementById('sparks').innerHTML = sp;

  // Measure only after the web fonts are in, or the fitted sizes are wrong.
  document.body.offsetHeight;
  await document.fonts.ready;
  // Measure in the settled state: entrance animations scale and space the text.
  window.seek(6000);
  fit(document.getElementById('title'), d.style === 'minimal' ? 880 : 960, d.title_size || (d.lang === 'en' ? 120 : 140));
  for (const el of document.querySelectorAll('.line')) fit(el, 940, d.style === 'arch' ? 38 : 46);
  fit(offer, 940, 38);
  fit(document.getElementById('shop'), 900, d.lang === 'en' ? 70 : 74);
  fit(document.getElementById('trade'), 900, 30);
  fit(document.getElementById('addrtext'), 870, 27);
  fit(document.getElementById('phones'), 920, 35);
  fit(document.getElementById('office'), 920, 26);
  return true;
};

window.seek = (ms) => {
  for (const a of document.getAnimations()) { a.pause(); a.currentTime = ms; }
};
</script>
